name: PR preview link

# Cloudflare's Workers Builds app is meant to drop a preview URL comment on every
# pull request, but it misses some runs: PR #12 finished with a green
# "Workers Builds: void" check and no comment at all, so the PR had no preview
# link.
#
# This job is a deterministic fallback. When a Workers Builds check finishes it
# waits a short grace period for Cloudflare's own comment, and only if that never
# landed does it post (and keep refreshed) the same preview URL. It can also be
# run by hand for one check run, to backfill a PR that was missed.

on:
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      check_run_id:
        description: "Check run id to backfill a preview link for"
        required: true
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: "pr-preview-${{ github.event.check_run.head_sha || inputs.check_run_id }}"
  cancel-in-progress: true

jobs:
  link:
    name: Ensure preview link
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.check_run.name, 'Workers Builds: ')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Cloudflare's comment to land
        if: github.event_name == 'check_run'
        run: sleep 120

      - name: Post fallback preview link
        uses: actions/github-script@v7
        env:
          SUBDOMAIN: abukhleif94.workers.dev
        with:
          script: |
            const marker = '<!-- void-preview-link -->';
            const cfBot = 'cloudflare-workers-and-pages[bot]';
            const { owner, repo } = context.repo;

            const run = context.eventName === 'workflow_dispatch'
              ? (await github.rest.checks.get({
                  owner,
                  repo,
                  check_run_id: Number(core.getInput('check_run_id')),
                })).data
              : context.payload.check_run;

            const pr = (run.pull_requests || []).find((p) => p && p.number);
            if (!pr) {
              core.info('check run is not attached to a pull request; nothing to do');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const cloudflare = comments.find(
              (c) => c.user?.login === cfBot && /Preview URL/i.test(c.body || ''),
            );
            if (cloudflare) {
              core.info(`Cloudflare posted its own preview comment: ${cloudflare.html_url}`);
              return;
            }

            const worker = run.name.replace('Workers Builds: ', '').trim();
            const alias = (run.details_url || '').match(/\/previews\/([^/]+)\/builds\//);
            if (!alias) {
              core.info(`no preview alias in this check run (${run.details_url || 'no details url'}); skipping`);
              return;
            }

            const url = `https://${alias[1]}-${worker}.${process.env.SUBDOMAIN}`;
            const sha = (run.head_sha || '').slice(0, 7);
            const ok = run.conclusion === 'success';

            const body = [
              marker,
              `### ${ok ? 'Preview' : 'Preview build failed'}: ${url}`,
              '',
              `Commit \`${sha}\` - Workers Builds: **${run.conclusion}**`,
              '',
              '<!-- fallback posted by .github/workflows/pr-preview-link.yml -->',
            ].join('\n');

            const existing = comments.find((c) => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`updated fallback preview comment ${existing.html_url}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body,
              });
              core.info(`posted fallback preview comment ${created.data.html_url}`);
            }
